name: Runtime floor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: runtime-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-node-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install with supported development tooling
        run: npm exec --yes --package=npm@12.0.2 -- npm ci --ignore-scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Execute real detached native fixtures at the runtime floor
        run: node --test test/autonomous-runtime-smoke.mjs
